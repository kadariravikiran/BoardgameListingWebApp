apiVersion: apps/v1
kind: Deployment

metadata:
  name: boardgame-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: boardgame-app

  template:
    metadata:
      labels:
        app: boardgame-app

    spec:
      containers:
        - name: boardgame-app
          image: asia-south1-docker.pkg.dev/project-b1401e3c-6c22-44e2-ba6/boardgame-repo/boardgame-app:latest

          ports:
            - containerPort: 8080
